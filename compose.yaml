services:
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    container_name: customecon-sql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - orcullo-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: customcon-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT:-8085}:80"
    depends_on:
      - database
    networks:
      - orcullo-network

volumes:
  db_data:

networks:
  orcullo-network:
    name: ${DOCKER_NETWORK:-orcullo-controller-network}
    external: true
