# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # ngrok tunnels to the local server, forwarding the original scheme/host
    # via X-Forwarded-* headers. Trust them so links, cookies and CSRF
    # checks work correctly behind the tunnel.
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Needed for the login form, cart/checkout/admin POST tokens.
    csrf_protection: true

    # Cache-busting query string on asset() URLs (bump when css/js change).
    assets:
        version: '20261113_v14'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
