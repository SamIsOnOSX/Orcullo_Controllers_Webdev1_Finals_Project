security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory:
            memory:
                users:
                    admin:
                        password: '$2y$13$C7ly0HIfiNWeknPg5OhCh.B5DtUCIVfshhnatLCSm7dJrzt2kIY.K'
                        roles: ['ROLE_ADMIN', 'ROLE_USER'] # admin123
                    'admin@orcullo.com':
                        password: '$2y$13$C7ly0HIfiNWeknPg5OhCh.B5DtUCIVfshhnatLCSm7dJrzt2kIY.K'
                        roles: ['ROLE_ADMIN', 'ROLE_USER']
                    customer:
                        password: '$2y$13$KANMYWR8.XCmAcS9u3aEsu0pH/FPoOmSt8PmFBZ5yNueoaPN/ibdC'
                        roles: ['ROLE_USER'] # customer123
                    'player1@example.com':
                        password: '$2y$13$KANMYWR8.XCmAcS9u3aEsu0pH/FPoOmSt8PmFBZ5yNueoaPN/ibdC'
                        roles: ['ROLE_USER'] 

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: identifier
                password_parameter: password
                enable_csrf: true
                default_target_path: homepage
            logout:
                path: app_logout
                target: homepage

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
